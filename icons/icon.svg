<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f2b6a"/>
      <stop offset="100%" stop-color="#09153a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Academic Cap / Mortarboard -->
  <g filter="url(#shadow)">
    <!-- Cap top diamond -->
    <polygon points="256,120 420,185 256,250 92,185" fill="#ffffff"/>
    <polygon points="256,132 400,188 256,242 112,188" fill="#f8fafc"/>
    
    <!-- Skullcap underneath -->
    <path d="M160,212 L160,285 C160,335 352,335 352,285 L352,212 Z" fill="#e2e8f0"/>
    <path d="M176,218 L176,280 C176,320 336,320 336,280 L336,218 Z" fill="url(#goldGrad)"/>

    <!-- Tassel -->
    <path d="M256,190 L390,205 L395,300" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="395" cy="305" r="12" fill="url(#goldGrad)"/>
  </g>

  <!-- Badge banner with UniSS 2026 -->
  <g filter="url(#shadow)">
    <rect x="96" y="340" width="320" height="68" rx="20" fill="url(#goldGrad)"/>
    <text x="256" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">UniSS 2026</text>
  </g>

  <!-- Checkmark circle (Success / Quiz simulation) -->
  <circle cx="390" cy="130" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6" filter="url(#shadow)"/>
  <path d="M374,130 L386,142 L408,120" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>